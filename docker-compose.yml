services:
  daily-seed-fetcher:
    build: .
    image: ghcr.io/pokerogue-offline/daily-seed-fetcher:latest
    container_name: daily-seed-fetcher
    restart: unless-stopped
    environment:
      - GH_PAT=${GH_PAT}
    volumes:
      - /var/www/default/html:/output
      - ./crontab:/etc/crontabs/root:ro
      - /opt/scripts/all/send_ntfy:/usr/local/bin/send_ntfy
      - pkr-state:/state

volumes:
  pkr-state:
